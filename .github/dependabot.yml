# Keeps the SHA-pinned actions current. Dependabot rewrites the SHA and its trailing
# `# vX.Y.Z` comment together, in one grouped PR per month, into develop.
# It reads this file from the default branch (main), so it takes effect after release.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
