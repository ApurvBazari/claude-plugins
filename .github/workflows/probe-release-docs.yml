name: Probe release-docs CI

# Throwaway probe for the release-docs plan. Runs on a PR whose BASE is the probe branch:
# on PR events claude-code-action restores .claude/ and CLAUDE.md from the base branch, so the
# base must already carry the probe skill and agent. (push is not a supported action event.)

on:
  pull_request:
    types: [opened, synchronize]
    branches: [probe/release-docs-ci]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: opus_plain
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 2
          prompt: |
            Reply with the single word OK.
      - name: Keep the V3 execution file
        if: always()
        env:
          F: ${{ steps.opus_plain.outputs.execution_file }}
        run: cp "$F" "$RUNNER_TEMP/opus-plain.json" 2>/dev/null || echo "no execution file"
      - id: opus_probe
        if: always()
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 12
            --plugin-dir walkthrough
            --allowedTools "Skill,Read,Write,Agent,Task,Bash(echo:*)"
          prompt: |
            /probe-ci
      - name: Keep the V1 execution file
        if: always()
        env:
          F: ${{ steps.opus_probe.outputs.execution_file }}
        run: cp "$F" "$RUNNER_TEMP/opus-probe.json" 2>/dev/null || echo "no execution file"
      - name: V1 + V3 results
        if: always()
        run: |
          echo "--- probe-out.txt"; cat probe-out.txt || echo "probe-out.txt MISSING"
          echo "--- protected-path files on disk"; ls -la .claude/probe-write.txt .claude/probe-redirect.txt .github/probe-write.txt 2>&1 || true
          echo "--- git state after the action (did it commit?)"; git status --short; git log -1 --oneline
          for f in "$RUNNER_TEMP/opus-plain.json" "$RUNNER_TEMP/opus-probe.json"; do
            echo "--- $f"
            [ -f "$f" ] || { echo "no execution file: $f"; continue; }
            python3 - "$f" <<'PY'
          import json, sys
          msgs = json.load(open(sys.argv[1]))
          init = next((m for m in msgs if m.get("type") == "system" and m.get("subtype") == "init"), {})
          res = next((m for m in reversed(msgs) if m.get("type") == "result"), {})
          print("model:", init.get("model"), "| is_error:", res.get("is_error"), "| turns:", res.get("num_turns"),
                "| cost:", res.get("total_cost_usd"), "| usage:", list((res.get("modelUsage") or {}).keys()))
          print("permission_mode:", init.get("permissionMode"), "| tools:", init.get("tools"))
          print("agents:", init.get("agents"), "| skills:", init.get("skills"), "| slash:", init.get("slash_commands"))
          print("result:", str(res.get("result"))[:600])
          print("denials:", json.dumps(res.get("permission_denials"))[:1500])
          PY
          done
