name: Plugin Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck on all .sh files
        # Third-party action — SHA-pinned for supply-chain integrity (audit finding L2).
        # 00cae50 == tag v2.0.0; bump the SHA + comment together when upgrading.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: .
          severity: warning

  json-validation:
    name: Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate plugin manifests
        run: .github/scripts/validate-manifests.sh

  structure-check:
    name: Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate plugin directory structure
        run: .github/scripts/check-structure.sh

  reference-check:
    name: Reference Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check reference file integrity
        run: .github/scripts/check-references.sh

  action-pinning:
    name: Action Pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify GitHub Actions are pinned to immutable refs
        run: .github/scripts/check-action-pinning.sh

  version-sync:
    name: Plugin Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify plugin.json versions match marketplace.json entries
        run: .github/scripts/check-version-sync.sh

  state-gitignore:
    name: State File Gitignore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify onboard state files are gitignored
        run: .github/scripts/check-state-gitignore.sh

  belts:
    name: Test Belts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      # onboard/schemas/check-schemas.py validates every schema fixture only when jsonschema
      # is importable; without it the suite is skipped, so the belts would report a pass having
      # validated no schema at all. tests/ci/test-workflow-contracts.sh parses workflows with PyYAML.
      - name: Install belt dependencies
        run: pip install jsonschema pyyaml
      # tests/test_private_names.sh needs the owner's list of private project names, which is never
      # committed. It comes from the PRIVATE_NAMES secret, scoped to this one step. GitHub withholds
      # secrets from fork PRs, so there the list is absent and the guard skips. Every name is masked
      # before any later step runs, and under GITHUB_ACTIONS the guard prints only a name's number
      # and hit count, never the matching lines (masking is case-sensitive; the guard's match is not).
      - name: Load the private-name list
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: |
          if [ -z "$PRIVATE_NAMES" ]; then echo "PRIVATE_NAMES is not set: the private-name guard will skip"; exit 0; fi
          mkdir -p .claude
          printf '%s\n' "$PRIVATE_NAMES" > .claude/private-names.txt
          n=0
          while IFS= read -r line || [ -n "$line" ]; do
            name="$(printf '%s' "${line%%#*}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -n "$name" ]; then echo "::add-mask::$name"; n=$((n + 1)); fi
          done < .claude/private-names.txt
          echo "loaded $n private name(s)"
      - name: Run all plugin test belts
        run: bash tests/run-all.sh

  repo-guards:
    name: Repo Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify-delegation guard
        run: .github/scripts/check-notify-delegation.sh
      - name: Phase-numbering guard
        run: .github/scripts/check-phase-numbering.sh
      - name: Phase-tracking guard
        run: .github/scripts/check-phase-tracking.sh
      - name: Skill-refs guard
        run: .github/scripts/check-skill-refs.sh
      - name: Ref-paths guard
        run: .github/scripts/check-ref-paths.sh

  # The release gate (release-docs spec § 7, D10): a PR to main fails while the docs owe anything
  # for the release. The owner makes this check required on main. release-docs.yml opens the PR
  # that clears it; locally, /release-docs does the same.
  docs-obligations:
    name: Docs Obligations
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block the release while docs obligations are open
        run: bash .claude/skills/release-docs/scripts/docs-detect.sh --range origin/main..HEAD --gate
