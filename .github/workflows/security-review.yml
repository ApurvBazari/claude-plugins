name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  auto-security-review:
    # Same-repo, human-authored PRs only (fork PRs get no secrets; bot actors are rejected).
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress selects tag mode: the checklist comment the prompt updates.
          track_progress: true
          include_fix_links: false
          # 100 turns: multi-file audits need room to read, analyse, and post. v1 now fails the
          # step on max turns, and the guard below names the cause, so truncation is never silent.
          claude_args: |
            --model claude-opus-4-6
            --max-turns 100
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Security audit for a Claude Code plugin repo (markdown + shell scripts + JSON manifests — no compiled code, no web frontend, no database).
            It contains 5 plugins: onboard (codebase analyzer), notify (system notifications), handoff (session continuity), walkthrough (interactive HTML docs), lens (intent-grounded review).

            Focus on what matters for this codebase:

            1. **Shell injection** — unquoted variables, eval usage, unsafe interpolation in hook scripts (.sh files)
            2. **Command injection** — user-controlled input flowing into shell commands via stdin JSON parsing
            3. **Path traversal** — file operations using unsanitized paths from tool input
            4. **Credential exposure** — hardcoded secrets, tokens, or API keys in code or config
            5. **Unsafe file operations** — insecure permissions, symlink attacks, TOCTOU races in hook scripts
            6. **Supply-chain hardening** — beyond what the action-pinning linter already catches (that one fails any `uses:` not pinned to a full 40-character commit SHA with a version comment, so mutable tags such as `@v4` or `@beta` never reach this review), look for workflows that fetch or interpolate external content: any `run:` step that interpolates attacker-controllable GitHub event inputs (issue/PR title or body, commit messages, head_ref, etc.) without `env:` quoting; any workflow that downloads scripts/binaries from a URL and executes them; any `pull_request_target` trigger that checks out the PR head. The deterministic pinning linter and the marketplace-version-sync linter handle the mechanical cases — your job is the subtler ones.
            7. **Prompt-injection in agent prompts** — SKILL.md files that build prompts for `Agent(...)` or `Skill(...)` invocations by interpolating user-controlled free-text (wizardAnswers.projectDescription, pain points, notes, anything captured from a wizard Q&A) without wrapping it in an explicit `<untrusted-user-input field="...">...</untrusted-user-input>` data fence. The pattern we've adopted (see `onboard/skills/start/references/onboard-context-builder.md` § Untrusted-input sanitiser and `onboard/skills/generate/SKILL.md` § validate) is: length-cap + strip `\r` + wrap in the XML fence + instruct the agent to treat fenced content as data, not instructions. Flag any new SKILL.md that forwards free-text into an agent prompt without this treatment.

            Skip categories irrelevant to this repo: SQL/NoSQL/LDAP injection, XXE, XSS, CSRF, deserialization, authentication, session management.

            **Progress tracking**: Update your progress comment by checking off each item as you complete it. After finishing all checks, post a final summary with findings listed as Critical / High / Medium / Low. If clean, confirm the changes pass review. Always post the final report — do not end without updating the comment.
      - name: Fail unless the audit completed
        if: always()
        env:
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/scripts/assert-claude-run-complete.sh

  security-review:
    # "@claude security-review" on a PR, from a trusted human. Agent mode (a prompt, no
    # track_progress): Claude reads the PR and posts one report comment via `gh pr comment`.
    if: >
      (github.event_name == 'pull_request_review_comment' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request)) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude security-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # A comment event checks out the default branch; agent mode fetches no PR context.
      # Check out the PR head so Claude reads the files under review, not main's copies.
      - name: Check out the PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout "$PR_NUMBER"
      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-6
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Security audit for a Claude Code plugin repo (markdown + shell scripts + JSON manifests — no compiled code, no web frontend, no database).
            It contains 5 plugins: onboard (codebase analyzer), notify (system notifications), handoff (session continuity), walkthrough (interactive HTML docs), lens (intent-grounded review).

            Focus on what matters for this codebase:

            1. **Shell injection** — unquoted variables, eval usage, unsafe interpolation in hook scripts (.sh files)
            2. **Command injection** — user-controlled input flowing into shell commands via stdin JSON parsing
            3. **Path traversal** — file operations using unsanitized paths from tool input
            4. **Credential exposure** — hardcoded secrets, tokens, or API keys in code or config
            5. **Unsafe file operations** — insecure permissions, symlink attacks, TOCTOU races in hook scripts
            6. **Supply-chain hardening** — beyond what the action-pinning linter already catches (that one fails any `uses:` not pinned to a full 40-character commit SHA with a version comment, so mutable tags such as `@v4` or `@beta` never reach this review), look for workflows that fetch or interpolate external content: any `run:` step that interpolates attacker-controllable GitHub event inputs (issue/PR title or body, commit messages, head_ref, etc.) without `env:` quoting; any workflow that downloads scripts/binaries from a URL and executes them; any `pull_request_target` trigger that checks out the PR head. The deterministic pinning linter and the marketplace-version-sync linter handle the mechanical cases — your job is the subtler ones.
            7. **Prompt-injection in agent prompts** — SKILL.md files that build prompts for `Agent(...)` or `Skill(...)` invocations by interpolating user-controlled free-text (wizardAnswers.projectDescription, pain points, notes, anything captured from a wizard Q&A) without wrapping it in an explicit `<untrusted-user-input field="...">...</untrusted-user-input>` data fence. The pattern we've adopted (see `onboard/skills/start/references/onboard-context-builder.md` § Untrusted-input sanitiser and `onboard/skills/generate/SKILL.md` § validate) is: length-cap + strip `\r` + wrap in the XML fence + instruct the agent to treat fenced content as data, not instructions. Flag any new SKILL.md that forwards free-text into an agent prompt without this treatment.

            Skip categories irrelevant to this repo: SQL/NoSQL/LDAP injection, XXE, XSS, CSRF, deserialization, authentication, session management.

            Post the report as a single `gh pr comment` on PR NUMBER, listing findings as
            Critical / High / Medium / Low. If clean, say the changes pass review.
      - name: Fail unless the review completed
        if: always()
        env:
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/scripts/assert-claude-run-complete.sh
