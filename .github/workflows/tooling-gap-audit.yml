name: Tooling Gap Audit

# Every 15 days (and on demand): detect drift between this repo's Claude tooling and the
# baseline in .claude/audit-baseline.json.
#   1. audit-tooling.sh runs the structural checks; collect-audit-findings.sh turns them, plus any
#      baseline path that no longer exists, into a sorted list of findings — no model involved.
#   2. One Claude pass writes a dated markdown report explaining each finding.
#   3. open-gap-audit-issue.sh fingerprints the findings list and files the report as a
#      `tooling-audit` issue only when that fingerprint is new, closing the issue it supersedes, or
#      closing the open one once nothing drifts. The model's wording never decides any of this.
# Nothing is committed or pushed: the report lives in the issue.

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to audit
        required: false
        default: develop

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the audited branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'develop' }}
          fetch-depth: 1

      - name: Run structural drift checks
        id: drift
        run: |
          set -euo pipefail
          mkdir -p .audit-out
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          bash onboard/scripts/audit-tooling.sh . > .audit-out/drift.md
          cat .audit-out/drift.md

      - name: Collect deterministic findings
        run: |
          set -euo pipefail
          .github/scripts/collect-audit-findings.sh .audit-out/drift.md .claude/audit-baseline.json > .audit-out/findings.txt
          echo "Findings ($(grep -c . .audit-out/findings.txt || true)):"
          cat .audit-out/findings.txt

      - name: Load the audit prompt
        id: prompt
        run: |
          set -euo pipefail
          {
            echo 'body<<PROMPT_EOF'
            cat .claude/prompts/tooling-gap-audit.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      # Agent mode (a prompt on a schedule/dispatch event). github_token skips the Claude-App
      # token exchange, which rejects runs whose workflow file differs from the default branch.
      - id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-4-6
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write"
          prompt: |
            AUDIT DATE: ${{ steps.drift.outputs.date }}
            FINDINGS: .audit-out/findings.txt
            DRIFT REPORT: .audit-out/drift.md
            REPORT OUTPUT: .audit-out/gap-report.md

            ${{ steps.prompt.outputs.body }}

      - name: Fail unless the audit completed
        if: always()
        env:
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: .github/scripts/assert-claude-run-complete.sh

      - name: File the audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_DATE: ${{ steps.drift.outputs.date }}
        run: .github/scripts/open-gap-audit-issue.sh "$AUDIT_DATE" .audit-out/gap-report.md .audit-out/findings.txt
