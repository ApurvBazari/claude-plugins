<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Failure-arch fixture — walkthrough</title>
<style>
:root{--bg-deep:#08090c;--tp:#e8eaf0;--ts:#7d8399;--accent:#22d3ee;--accent-soft:rgba(34,211,238,.08);--border:#1e2230;--ease:cubic-bezier(.16,1,.3,1);--sans:sans-serif;--mono:monospace;--serif:serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-deep);color:var(--tp);font-family:var(--sans);}
section{padding:4rem 0 2rem;scroll-margin-top:70px;transition:opacity .7s var(--ease),transform .7s var(--ease);}
html.js section{opacity:0;transform:translateY(24px);}
section.vis{opacity:1;transform:none;}
.panel{position:fixed;top:0;right:0;width:300px;height:100vh;background:#0f1117;transform:translateX(100%);}
.panel.open{transform:none;}
</style></head>
<body>
  <main>
    <section id="top" class="vis"><h1>Fixture</h1><p>Always-visible hero.</p></section>
    <section id="s1"><div class="sec-label">flow</div><h2>Section one</h2>
      <button class="chip" onclick="openSurface('d1')">open detail</button></section>
  </main>
  <aside class="panel" id="panel"><span class="x" onclick="closeD()">✕</span>
    <div class="pk" id="panelKicker">Detail</div><div class="pb" id="panelBody"></div></aside>
  <div id="sheets"></div>
  <dialog class="sheet pane-dialog" id="paneDialog"><button class="x" onclick="this.closest('dialog').close()">✕</button><div class="sf-body" id="paneDialogBody"></div></dialog>
  <script type="application/json" id="wt-data">{"DET":{"d1":{"k":"Detail","h":"A detail with a \"quote\", a newline\nand <\/script> in it","summary":"Proves the inert island survives hostile characters.","where":["file.ts:1"],"related":[]}},"SURF":{"d1":"pane"}}</script>
  <script>
document.documentElement.classList.add('js');
const _WT=(()=>{try{return JSON.parse(document.getElementById('wt-data').textContent||'{}');}catch(e){return{};}})();
const DET=_WT.DET||{}, SURF=_WT.SURF||{};
function renderSurface(d,host){if(!d||!host)return;let h='';if(d.h)h+=`<h3>${d.h}</h3>`;if(d.summary)h+=`<p>${d.summary}</p>`;host.innerHTML=h;}
const panel=document.getElementById('panel');
function openPane(id){const d=DET[id];if(!d)return;const k=document.getElementById('panelKicker');if(k)k.textContent=d.k||'Detail';renderSurface(d,document.getElementById('panelBody'));panel.classList.add('open');}
function openSurface(id){openPane(id);}
function closeD(){panel.classList.remove('open');}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('vis');}),{threshold:.1});
document.querySelectorAll('section').forEach(s=>io.observe(s));
setTimeout(()=>document.querySelectorAll('section').forEach(s=>s.classList.add('vis')),2500);
  </script>
  <script>/* component JS block (empty in this fixture) */</script>
</body></html>
